[package]
name = "typiql-core"
version = "0.1.0"
edition = "2021"
description = "Core runtime for the typiql async-graphql CRUD framework — adapter trait, broker, resolvers, and axum router"
license = "MIT"
repository.workspace = true
keywords = ["graphql", "async-graphql", "crud", "axum"]
categories = ["web-programming", "database"]

[dependencies]
typiql-macros = { path = "../typiql-macros", version = "0.1" }

async-graphql        = { version = "7", features = ["dataloader"] }
async-graphql-axum   = "7"
axum                 = { version = "0.8", features = ["ws"] }
async-trait          = "0.1"
tokio                = { version = "1", features = ["sync", "rt"] }
tokio-stream         = { version = "0.1", features = ["sync"] }
futures-util         = "0.3"
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
tower-http           = { version = "0.6", features = ["cors"] }
tower                = "0.5"
http                 = "1"
bytes                = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
# Transport tests: a real server, a WebSocket client and a raw HTTP/1 client.
tokio-tungstenite = "0.29"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
