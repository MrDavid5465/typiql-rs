[package]
name = "typiql-adapter-ldap"
version = "0.1.0"
edition = "2021"
description = "LDAP / Active Directory adapter for typiql — directory entries as typiql types"
license = "MIT"
repository.workspace = true
keywords = ["graphql", "typiql", "ldap", "active-directory"]
categories = ["database"]

[features]
# Kerberos (integrated) binds — needs the system's GSSAPI libraries.
gssapi = ["ldap3/gssapi"]

[dependencies]
typiql-core = { path = "../typiql-core", version = "0.1" }

async-trait = "0.1"
serde_json  = "1"
base64      = "0.22"
tokio       = { version = "1", features = ["sync"] }
ldap3       = { version = "0.11", default-features = false, features = ["tls-rustls"] }
image       = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp"] }
