[package]
name = "typiql-conformance"
version = "0.0.0"
edition = "2021"
description = "Runs one GraphQL test suite against every typiql adapter — a type must behave the same whichever adapter serves it"
license = "MIT"
repository.workspace = true
publish = false

[dependencies]
# The macros emit `::typiql::…` paths, as seen from a consuming app.
typiql = { package = "typiql-core", path = "../typiql-core" }
typiql-adapter-json = { path = "../typiql-adapter-json" }
typiql-adapter-duckdb = { path = "../typiql-adapter-duckdb" }
typiql-adapter-mssql = { path = "../typiql-adapter-mssql" }
typiql-adapter-mongo = { path = "../typiql-adapter-mongo" }
typiql-adapter-ldap = { path = "../typiql-adapter-ldap" }
uuid = { version = "1", features = ["v4"] }

async-graphql = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"

[dev-dependencies]
mongodb = "3"
futures-util = "0.3"
ldap3 = { version = "0.11", default-features = false, features = ["tls-rustls"] }
