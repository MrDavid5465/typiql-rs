[package]
name = "typiql-adapter-mongo"
version = "0.1.0"
edition = "2021"
description = "MongoDB adapter for typiql — collections in a MongoDB database, queried with aggregation pipelines"
license = "MIT"
repository.workspace = true
keywords = ["graphql", "typiql", "mongodb", "persistence"]
categories = ["database"]

[dependencies]
typiql-core = { path = "../typiql-core", version = "0.1" }

async-trait  = "0.1"
serde_json   = "1"
uuid         = { version = "1", features = ["v4"] }
tokio        = { version = "1", features = ["sync"] }
futures-util = "0.3"
mongodb      = "3"
