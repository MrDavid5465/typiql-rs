[package]
name = "typiql-macros"
version = "0.1.0"
edition = "2021"
description = "Procedural macros for the typiql async-graphql CRUD framework"
license = "MIT"
repository.workspace = true
keywords = ["graphql", "async-graphql", "crud", "macros"]
categories = ["web-programming", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
